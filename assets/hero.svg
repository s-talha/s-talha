<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Talha S. AI engineer in Stockholm, building agents that use tools and show their work.">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/><stop offset=".5" stop-color="#EC4899"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <clipPath id="clip"><rect width="1200" height="360" rx="20"/></clipPath>
  </defs>
  <style>
    @keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,18px)}}
    @keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,24px)}}
    @keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,-20px)}}
    
    @keyframes k0{0%,10%{opacity:1;transform:none}14%,22%{opacity:0;transform:translateY(4px)}26%,100%{opacity:1;transform:none}}.n0{animation:k0 10s ease-out infinite}@keyframes k1{0%,10%{opacity:1;transform:none}14%,34%{opacity:0;transform:translateY(4px)}38%,100%{opacity:1;transform:none}}.n1{animation:k1 10s ease-out infinite}@keyframes k2{0%,10%{opacity:1;transform:none}14%,46%{opacity:0;transform:translateY(4px)}50%,100%{opacity:1;transform:none}}.n2{animation:k2 10s ease-out infinite}@keyframes k3{0%,10%{opacity:1;transform:none}14%,58%{opacity:0;transform:translateY(4px)}62%,100%{opacity:1;transform:none}}.n3{animation:k3 10s ease-out infinite}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cursor{animation:blink 1.1s steps(1) infinite}
    @media (prefers-reduced-motion: reduce){.n,.cursor,.a1,.a2,.a3{animation:none}}
  </style>
  <rect width="1200" height="360" rx="20" fill="#080812"/>
  <image href="data:image/jpeg;base64," x="0" y="0" width="1200" height="360" preserveAspectRatio="none" clip-path="url(#clip)"/>
  <path d="M0 314 C 220 282, 420 346, 640 320 S 1000 290, 1200 324 L 1200 360 L 0 360 Z" fill="url(#g)" opacity=".10" clip-path="url(#clip)"/>
  <path d="M0 314 C 220 282, 420 346, 640 320 S 1000 290, 1200 324" fill="none" stroke="url(#g)" stroke-width="1.5" opacity=".55"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="19.5" fill="none" stroke="#F8FAFC" stroke-opacity=".08"/>

  <text x="64" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#22D3EE">AI engineer in Stockholm</text>
  <text x="60" y="186" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="-2" fill="#F8FAFC">Talha S.</text>
  <rect x="64" y="206" width="72" height="4" rx="2" fill="url(#g)"/>
  <text x="64" y="248" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#CBD5E1">I build AI agents that use real tools,</text>
  <text x="64" y="278" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#CBD5E1">explain their decisions and fail safely.</text>

  <rect x="704" y="62" width="452" height="226" rx="14" fill="#11111F" fill-opacity=".88"/>
  <rect x="704.5" y="62.5" width="451" height="225" rx="13.5" fill="none" stroke="url(#g)" stroke-opacity=".45"/>
  <line x1="756" y1="96" x2="756" y2="262" stroke="#25253A" stroke-width="1.5"/>
  <g class="n n0"><circle cx="756" cy="104" r="6.5" fill="#8B5CF6"/><circle cx="756" cy="104" r="12" fill="#8B5CF6" opacity=".18"/>
      <text x="782" y="109" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#F8FAFC">I&#x27;ll look up the order first.</text></g><g class="n n1"><circle cx="756" cy="152" r="6.5" fill="#EC4899"/><circle cx="756" cy="152" r="12" fill="#EC4899" opacity=".18"/>
      <text x="782" y="157" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#EC4899">get_order(&quot;A-1042&quot;)</text></g><g class="n n2"><circle cx="756" cy="200" r="6.5" fill="#22D3EE"/><circle cx="756" cy="200" r="12" fill="#22D3EE" opacity=".18"/>
      <text x="782" y="205" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#22D3EE">delivered, 32 days ago</text></g><g class="n n3"><circle cx="756" cy="248" r="6.5" fill="#8B5CF6"/><circle cx="756" cy="248" r="12" fill="#8B5CF6" opacity=".18"/>
      <text x="782" y="253" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#F8FAFC">Outside the 30-day window. Escalating.</text></g>
  <rect class="cursor" x="782" y="268" width="9" height="2" fill="#94A3B8"/>
</svg>