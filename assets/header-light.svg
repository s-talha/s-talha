<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Sana. Senior software engineer building AI agents.">
  <style>
    .n{opacity:1}
    @keyframes k0{0%,10%{opacity:1;transform:none}14%,22%{opacity:0;transform:translateY(4px)}26%,100%{opacity:1;transform:none}}.n0{animation:k0 10s ease-out infinite}@keyframes k1{0%,10%{opacity:1;transform:none}14%,34%{opacity:0;transform:translateY(4px)}38%,100%{opacity:1;transform:none}}.n1{animation:k1 10s ease-out infinite}@keyframes k2{0%,10%{opacity:1;transform:none}14%,46%{opacity:0;transform:translateY(4px)}50%,100%{opacity:1;transform:none}}.n2{animation:k2 10s ease-out infinite}@keyframes k3{0%,10%{opacity:1;transform:none}14%,58%{opacity:0;transform:translateY(4px)}62%,100%{opacity:1;transform:none}}.n3{animation:k3 10s ease-out infinite}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .cursor{animation:blink 1.1s steps(1) infinite}
    @media (prefers-reduced-motion: reduce){.n,.cursor{animation:none;opacity:1}}
  </style>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="#f6f8fb" stroke="#d5dbe4"/>
  <text x="56" y="82" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#7a8699">Stockholm, Sweden</text>
  <text x="54" y="146" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="600" letter-spacing="-1" fill="#1b2433">Sana</text>
  <text x="56" y="194" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#4a5568">Senior software engineer building AI agents</text>
  <text x="56" y="226" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#4a5568">that use tools and show their work.</text>
  <rect x="690" y="40" width="470" height="220" rx="12" fill="#ffffff" stroke="#d5dbe4"/>
  <line x1="742" y1="70" x2="742" y2="246" stroke="#d5dbe4" stroke-width="1.5"/>
  <g class="n n0">
      <circle cx="742" cy="92" r="7" fill="#2f5bd3" stroke="#ffffff" stroke-width="5"/>
      <text x="768" y="97" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#1b2433">I&#x27;ll look up the order first.</text>
    </g><g class="n n1">
      <circle cx="742" cy="140" r="7" fill="#b7791f" stroke="#ffffff" stroke-width="5"/>
      <text x="768" y="145" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#b7791f">get_order(&quot;A-1042&quot;)</text>
    </g><g class="n n2">
      <circle cx="742" cy="188" r="7" fill="#1f7a6b" stroke="#ffffff" stroke-width="5"/>
      <text x="768" y="193" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#1f7a6b">delivered, 32 days ago</text>
    </g><g class="n n3">
      <circle cx="742" cy="236" r="7" fill="#2f5bd3" stroke="#ffffff" stroke-width="5"/>
      <text x="768" y="241" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#1b2433">Outside the 30-day window. Escalating.</text>
    </g>
  <rect class="cursor" x="768" y="250" width="9" height="2" fill="#7a8699"/>
</svg>